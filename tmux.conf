# -------------------------------------------------------------------
# tmux configuration file
# -------------------------------------------------------------------

# set correct term (true color support for Ghostty/modern terminals)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
unbind C-b
set -g prefix C-a
set-option -g default-shell /bin/zsh
set -sg escape-time 1
set -g history-limit 50000
set -g focus-events on
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on
set -g detach-on-destroy off
set -g display-panes-time 2000

# reload config without killing server
bind r source-file ~/.tmux.conf \; display-message " Config reloaded..."

# new window
bind c new-window -c "#{pane_current_path}"

set -g base-index 1

# Turn the mouse on, but without copy mode dragging
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
unbind -n MouseDown3Pane

# use hjkl for moving
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes with HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# copy-paste like vim
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# use v and s for windows splits
unbind %
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Kill session
bind-key X confirm-before -p "Kill #S (y/n)?" "run-shell 'tmux switch-client -n \\\; kill-session -t \"\$(tmux display-message -p \"#S\")\"'"

# statusbar --------------------------------------------------------------
set -g status-left-length 20
set -g status-left "🚀 #S"
set -g status-right-length 40
set -g status-right "#(~/.bin/battery) ⭐ %d-%m-%Y %H:%M  "
set -g window-status-format "#I:#W#F"
set -g window-status-current-style "bg=yellow,fg=black"
set -g window-status-current-format "#I:#W#F"

set -g status-interval 5
set -g status-justify centre # center align window list

# default statusbar colors
set -g status-style "fg=yellow,bg=black"

# highlight status bar on activity
set -g visual-activity off
set -g monitor-activity on

# don't ask for confirmation when killing a pane
bind-key x kill-pane

# select session
bind m choose-session
